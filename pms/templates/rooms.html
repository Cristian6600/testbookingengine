{% extends "main.html"%}

{% block content %}
<!-- BUSCADOR -->
<form method="get" action="{% url 'rooms' %}" class="mb-4">
    <div class="row">
        <div class="col-md-8">
            <input 
                type="text" 
                name="q" 
                class="form-control" 
                placeholder="Buscar por nombre (ej. Room 1)" 
                value="{{ q }}"
            >
        </div>
        <div class="col-md-4 d-flex gap-2">
            <button type="submit" class="btn btn-primary">Buscar</button>
            {% if q %}
            <a href="{% url 'rooms' %}" class="btn btn-secondary">Limpiar</a>
            {% endif %}
        </div>
    </div>
</form>

<h1>Habitaciones del hotel</h1>

{% for room in rooms %}
<div class="row card mt-3 mb-3 hover-card bg-tr-250">
    <div class="col p-3">
        <div>
            {{ room.name }} ({{ room.room_type__name }})
        </div>
        <div>
            <a href="{% url 'room_details' pk=room.id %}">Ver detalles</a>
        </div>
    </div>
</div>

{% endfor %}
{% endblock content%}
