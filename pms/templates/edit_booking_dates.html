{% extends "main.html"%}

{% block content %}
<h2>Editar fechas - Reserva {{ booking.code }}</h2>

<form method="post">
  {% csrf_token %}
  {{ form.non_field_errors }}
  <p>
    <label>Entrada:</label> {{ form.checkin }}
  </p>
  <p>
    <label>Salida:</label> {{ form.checkout }}
  </p>
  <button type="submit">Guardar</button>
  <a href="{% url 'home' %}">Cancelar</a>
</form>

{% endblock content%}
